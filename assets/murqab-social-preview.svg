<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none">
  <defs>
    <radialGradient id="glow" cx="82%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0D11" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="65%" stop-color="#E5A93C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E5A93C" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" stroke="#181C24" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Matte Obsidian Base + Subtle Architectural Grid -->
  <rect width="1280" height="640" fill="#0B0D11"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.65"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect x="24" y="24" width="1232" height="592" rx="16" stroke="#1F2430" stroke-width="1.5"/>

  <!-- Top Classification / Eyebrow -->
  <text x="80" y="96" fill="#E5A93C" font-family="Consolas, 'Cascadia Code', monospace" font-size="16" font-weight="600" letter-spacing="3">AL9ERI / SOVEREIGN AI SECURITY</text>
  <rect x="80" y="114" width="420" height="1.5" fill="url(#goldRule)"/>

  <!-- Main Title + Arabic Calligraphy Label -->
  <text x="80" y="218" fill="#F9FAFB" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="88" font-weight="700" letter-spacing="-2">murqab</text>
  <text x="415" y="212" fill="#9CA3AF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="36" font-weight="500">المرقب</text>

  <!-- Executive Subtitle -->
  <text x="80" y="280" fill="#D1D5DB" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="28" font-weight="400">Bidirectional Rust + PyO3 MCP Security Firewall</text>
  <text x="80" y="320" fill="#9CA3AF" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="24" font-weight="400">&amp; Stealth-Document Unpacker (.docx / .pdf / Unicode)</text>

  <!-- Telemetry Flow Bar -->
  <rect x="80" y="372" width="760" height="68" rx="10" fill="#11141B" stroke="#262C3A" stroke-width="1.2"/>
  <text x="108" y="401" fill="#9CA3AF" font-family="Consolas, 'Cascadia Code', monospace" font-size="14" letter-spacing="1">INBOUND &amp; OUTBOUND ENFORCEMENT</text>
  <text x="108" y="425" fill="#F3F4F6" font-family="Consolas, 'Cascadia Code', monospace" font-size="18" font-weight="600">Agent  &lt;──[ -32001 Pin/Scan │ -32002 Taint │ -32003 DLP ]──&gt;  MCP</text>

  <!-- 4 Verified Spec Pills -->
  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="15" font-weight="600">
    <rect x="80" y="480" width="166" height="44" rx="8" fill="#151821" stroke="#E5A93C" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="163" y="507" text-anchor="middle" fill="#E5A93C">~55 µs / 10 KB</text>

    <rect x="262" y="480" width="218" height="44" rx="8" fill="#151821" stroke="#2D3446" stroke-width="1.2"/>
    <text x="371" y="507" text-anchor="middle" fill="#E5E7EB">SHA-256 Rug-Pull Pin</text>

    <rect x="496" y="480" width="176" height="44" rx="8" fill="#151821" stroke="#2D3446" stroke-width="1.2"/>
    <text x="584" y="507" text-anchor="middle" fill="#E5E7EB">Taint Guard -32002</text>

    <rect x="688" y="480" width="176" height="44" rx="8" fill="#151821" stroke="#2D3446" stroke-width="1.2"/>
    <text x="776" y="507" text-anchor="middle" fill="#E5E7EB">Egress DLP -32003</text>
  </g>

  <!-- Right-Side Architectural Watchtower Emblem -->
  <g transform="translate(895, 118)">
    <rect x="0" y="0" width="305" height="406" rx="22" fill="#10131A" stroke="#252B38" stroke-width="1.5"/>
    <circle cx="152.5" cy="185" r="122" stroke="#E5A93C" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="152.5" cy="185" r="96" stroke="#2A3140" stroke-width="1.2"/>
    <!-- Scaled Al Murqab Watchtower -->
    <g transform="translate(56, 78) scale(3)">
      <path d="M22 50L25 22H39L42 50H22Z" stroke="#E5A93C" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M20 22H44" stroke="#E5A93C" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M22 22V17H26V20H30V17H34V20H38V17H42V22" stroke="#E5A93C" stroke-width="2" stroke-linejoin="round"/>
      <path d="M32 28V35" stroke="#E5A93C" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M17 50H47" stroke="#9CA3AF" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <text x="152.5" y="340" text-anchor="middle" fill="#9CA3AF" font-family="Consolas, 'Cascadia Code', monospace" font-size="13" letter-spacing="2.5">RUST CORE · PYO3 · MIT</text>
    <text x="152.5" y="366" text-anchor="middle" fill="#E5A93C" font-family="Consolas, 'Cascadia Code', monospace" font-size="13" letter-spacing="1.5">github.com/al9eri/murqab</text>
  </g>
</svg>
