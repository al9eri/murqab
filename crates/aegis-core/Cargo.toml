[package]
name = "aegis-core"
version = "0.4.0"
edition = "2021"
license = "MIT"
description = "Zero-dependency-runtime Rust core for indirect prompt-injection, .docx/.pdf stealth-text, and Unicode smuggling detection"

[[bin]]
name = "aegis"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
flate2 = "1.0"
quick-xml = "0.37"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
unicode-normalization = "0.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
