[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-prompt-guard"
version = "0.2.0"
description = "Zero-dependency .docx/.pdf/.txt prompt-injection & stealth-text scanner for LLM and GRC pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zayed Alnuaimi"}]
keywords = [
  "prompt-injection",
  "llm-security",
  "rag-security",
  "ai-security",
  "pdf-sanitizer",
  "docx",
  "trojan-source",
  "unicode-security",
  "grc",
]

[project.urls]
Homepage = "https://github.com/al9eri/aegis-prompt-guard"
Repository = "https://github.com/al9eri/aegis-prompt-guard"
Issues = "https://github.com/al9eri/aegis-prompt-guard/issues"

[project.scripts]
aegis = "aegis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
