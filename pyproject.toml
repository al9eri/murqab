[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "aegis-prompt-guard"
version = "0.3.0"
description = "Rust-accelerated .docx/.pdf/.txt prompt-injection & stealth-text scanner for LLM and GRC pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zayed Alnuaimi"}]
keywords = [
  "prompt-injection",
  "llm-security",
  "rag-security",
  "ai-security",
  "pdf-sanitizer",
  "docx",
  "trojan-source",
  "unicode-security",
  "grc",
  "rust",
]

[project.urls]
Homepage = "https://github.com/al9eri/aegis-prompt-guard"
Repository = "https://github.com/al9eri/aegis-prompt-guard"
Issues = "https://github.com/al9eri/aegis-prompt-guard/issues"

[project.scripts]
aegis = "aegis.cli:main"

[tool.maturin]
manifest-path = "crates/aegis-py/Cargo.toml"
module-name = "aegis._native"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
