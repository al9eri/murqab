[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-prompt-guard"
version = "0.2.0"
description = "Zero-dependency .docx/.pdf/.txt prompt-injection & stealth-text scanner for LLM and GRC pipelines"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Zayed Alnuaimi"}]

[project.scripts]
aegis = "aegis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
